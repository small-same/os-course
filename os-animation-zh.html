<title>作業系統在做什麼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --navy:#0E1B2E; --navy2:#132741; --panel:#183253; --panel2:#1d3c61;
    --line:#284a70; --line2:#33587f;
    --ink:#EAF1F8; --mute:#9FB6CF; --dim:#6f89a4;
    --blue:#4A93D6; --cyan:#2DC7D8; --amber:#F2B84B; --green:#54C878; --red:#EA6B5E;
    --os:#2DC7D8;
    --mono:"IBM Plex Mono","Consolas",monospace;
    --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:
      radial-gradient(1200px 700px at 50% -10%, #17304f 0%, rgba(23,48,79,0) 60%),
      var(--navy);
    color:var(--ink); font-family:var(--sans);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:clamp(16px,3vw,34px) clamp(14px,3vw,30px) 26px;
    min-height:100vh; display:flex; flex-direction:column; gap:clamp(12px,2vh,20px);}

  /* ---------- header ---------- */
  header{display:flex; flex-direction:column; gap:6px;}
  .eyebrow{font-family:var(--mono); font-size:12.5px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--cyan); display:flex; align-items:center; gap:10px;}
  .eyebrow::before{content:""; width:26px; height:2px; background:var(--cyan); display:inline-block;}
  h1{margin:0; font-weight:900; font-size:clamp(26px,4.2vw,40px); letter-spacing:-.01em; text-wrap:balance; line-height:1.08;}
  h1 .os-word{color:var(--cyan);}

  /* ---------- caption ---------- */
  .caption{background:linear-gradient(180deg,var(--navy2),rgba(19,39,65,.4));
    border:1px solid var(--line); border-left:3px solid var(--cyan);
    border-radius:12px; padding:14px 18px; min-height:74px; display:flex; flex-direction:column; gap:5px;
    justify-content:center;}
  .role{font-family:var(--mono); font-size:12.5px; letter-spacing:.05em; color:var(--amber); font-weight:600;}
  .cap{font-size:clamp(14.5px,1.9vw,17px); line-height:1.55; color:var(--ink); text-wrap:pretty;}

  /* ---------- stage ---------- */
  .stage{flex:1; position:relative; display:grid; grid-template-rows:auto 1fr auto;
    gap:clamp(10px,1.8vh,18px); padding:clamp(10px,1.6vh,16px) 4px; min-height:340px;
    border-radius:14px;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/38px 38px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/38px 38px,
      var(--navy);
    background-blend-mode:soft-light,soft-light,normal;
    border:1px solid var(--line); overflow:hidden;}
  .layer{position:relative; z-index:2;}
  .layer-label{position:absolute; top:8px; left:12px; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.18em; text-transform:uppercase; color:var(--dim);}

  /* apps row */
  .apps{display:flex; gap:clamp(8px,1.6vw,16px); justify-content:center; padding-top:14px;}
  .app{position:relative; width:clamp(112px,15vw,168px); background:var(--panel);
    border:1px solid var(--line2); border-radius:12px; padding:12px 12px 14px;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, border-color .35s, opacity .35s;}
  .app__top{display:flex; align-items:center; gap:9px;}
  .app__glyph{width:30px; height:30px; border-radius:8px; display:grid; place-items:center;
    font-family:var(--mono); font-weight:600; font-size:13px; color:#08131f; flex:none;}
  .app__name{font-weight:700; font-size:14.5px; line-height:1.1;}
  .app__tag{font-family:var(--mono); font-size:10.5px; color:var(--mute);}
  .app--0 .app__glyph{background:var(--blue);} .app--1 .app__glyph{background:var(--cyan);}
  .app--2 .app__glyph{background:var(--amber);} .app--3 .app__glyph{background:var(--green);}
  .app__vmem{margin-top:10px; height:10px; border-radius:3px; background:#0c1626;
    border:1px solid var(--line); overflow:hidden; opacity:0; transform:translateY(4px);
    transition:opacity .4s, transform .4s;}
  .app__vmem::after{content:""; display:block; height:100%; width:100%; transform:scaleX(0);
    transform-origin:left; transition:transform .7s cubic-bezier(.2,.8,.2,1);}
  .app--0 .app__vmem::after{background:var(--blue);} .app--1 .app__vmem::after{background:var(--cyan);}
  .app--2 .app__vmem::after{background:var(--amber);} .app--3 .app__vmem::after{background:var(--green);}
  .app__label{position:absolute; top:-10px; right:10px; font-family:var(--mono); font-size:10px;
    padding:2px 7px; border-radius:99px; font-weight:600; opacity:0; transform:translateY(3px);
    transition:opacity .3s, transform .3s; white-space:nowrap;}
  /* connector arrow (app -> os) */
  .app__conn{position:absolute; left:50%; bottom:-16px; transform:translateX(-50%);
    width:2px; height:14px; background:linear-gradient(var(--line2),transparent); opacity:.4;}
  .app__conn::after{content:""; position:absolute; left:50%; bottom:-3px; transform:translateX(-50%);
    border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid var(--line2);}

  /* running state */
  .app.running{border-color:var(--green); box-shadow:0 0 0 1px var(--green),0 10px 30px -12px var(--green); transform:translateY(-4px);}
  .app.running .app__label{opacity:1; transform:translateY(0); background:rgba(84,200,120,.16); color:var(--green); box-shadow:inset 0 0 0 1px rgba(84,200,120,.5);}
  .app.running .app__conn{background:linear-gradient(var(--green),rgba(84,200,120,.1)); opacity:1;}
  .app.running .app__conn::after{border-top-color:var(--green);}
  .app.dim{opacity:.5;}

  /* scene 1: everyone wants the cpu */
  .stage[data-scene="1"] .app__conn{animation:pulse 1.1s ease-in-out infinite; opacity:1;}
  .stage[data-scene="1"] .app__conn::after{border-top-color:var(--amber);}
  .stage[data-scene="1"] .app__conn{background:linear-gradient(var(--amber),rgba(242,184,75,.05));}

  /* attacker/victim (scene 4) */
  .app.attacker{border-color:var(--red); box-shadow:0 0 0 1px var(--red);}
  .app.attacker .app__label{opacity:1; transform:none; background:rgba(234,107,94,.16); color:var(--red); box-shadow:inset 0 0 0 1px rgba(234,107,94,.5);}
  .app.victim{border-color:var(--blue);}

  /* OS band */
  .os{align-self:center; margin:0 auto; width:min(96%,760px);
    background:linear-gradient(180deg, rgba(45,199,216,.14), rgba(45,199,216,.05));
    border:1.5px solid var(--os); border-radius:14px; padding:16px 20px;
    box-shadow:0 0 0 1px rgba(45,199,216,.15), 0 18px 50px -24px var(--os);
    display:flex; align-items:center; justify-content:space-between; gap:16px; position:relative; overflow:hidden;}
  .os::before{content:""; position:absolute; inset:0; background:
    repeating-linear-gradient(90deg, transparent 0 12px, rgba(45,199,216,.05) 12px 13px);
    opacity:.7; pointer-events:none;}
  .os__id{display:flex; flex-direction:column; gap:3px; z-index:1;}
  .os__name{font-weight:900; font-size:clamp(18px,2.5vw,23px); letter-spacing:.01em;}
  .os__name span{color:var(--os);}
  .os__sub{font-family:var(--mono); font-size:11.5px; color:var(--mute); letter-spacing:.05em;}
  .os__role{z-index:1; font-family:var(--mono); font-size:13px; font-weight:600; color:#06131c;
    background:var(--os); padding:7px 14px; border-radius:99px; white-space:nowrap;
    transition:background .3s, color .3s;}
  /* shield (scene 4) */
  .shield{position:absolute; inset:0; z-index:2; display:grid; place-items:center; opacity:0;
    pointer-events:none; transition:opacity .3s;}
  .shield__badge{font-family:var(--mono); font-weight:600; font-size:13px; color:var(--red);
    background:rgba(14,27,46,.92); border:1.5px solid var(--red); border-radius:99px; padding:8px 16px;
    box-shadow:0 0 0 4px rgba(234,107,94,.14); transform:scale(.7);}
  .stage[data-scene="4"] .os{border-color:var(--red); box-shadow:0 0 0 1px rgba(234,107,94,.3),0 18px 50px -24px var(--red);}
  .stage[data-scene="4"] .os__role{background:var(--red); color:#0b0605;}
  .stage.denied .shield{opacity:1;}
  .stage.denied .shield__badge{animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards;}

  /* hardware row */
  .hw{display:flex; gap:clamp(8px,1.6vw,16px); justify-content:center; align-items:stretch; padding-bottom:8px;}
  .unit{background:var(--navy2); border:1px solid var(--line2); border-radius:12px;
    padding:12px 14px; min-width:clamp(110px,16vw,180px); display:flex; flex-direction:column; gap:8px;}
  .unit__h{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .unit__name{font-weight:700; font-size:14px;}
  .unit__en{font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:.05em;}
  /* cpu */
  .cpu__chip{position:relative; margin-top:2px; height:64px; border-radius:9px;
    background:linear-gradient(180deg,#14273f,#0e2136); border:1px solid var(--line2); display:grid; place-items:center;}
  .cpu__core{width:38px; height:38px; border-radius:7px; background:var(--panel2);
    border:1px solid var(--line2); display:grid; place-items:center; font-family:var(--mono);
    font-weight:600; font-size:15px; color:var(--cyan); transition:.2s;}
  .cpu__pins{position:absolute; inset:0;}
  .cpu__disp{font-family:var(--mono); font-size:12px; color:var(--amber); text-align:center; min-height:16px;}
  .stage[data-scene="1"] .cpu__core{color:var(--red); border-color:var(--red); box-shadow:0 0 0 1px var(--red); animation:shake .5s ease-in-out infinite;}
  .stage[data-scene="2"] .cpu__core{color:var(--green); border-color:var(--green); box-shadow:0 0 14px -2px var(--green);}
  /* memory */
  .mem__grid{margin-top:2px; display:grid; grid-template-columns:repeat(6,1fr); gap:4px;}
  .mem__cell{aspect-ratio:1/1; border-radius:4px; background:#0c1626; border:1px solid var(--line);
    transition:background .35s, border-color .35s, transform .35s;}
  .mem__cell.used{transform:scale(1.02);}
  .mem__cell.c0{background:var(--blue); border-color:var(--blue);}
  .mem__cell.c1{background:var(--cyan); border-color:var(--cyan);}
  .mem__cell.c2{background:var(--amber); border-color:var(--amber);}
  .mem__cell.c3{background:var(--green); border-color:var(--green);}
  .mem__cell.breach{animation:breach .6s ease-in-out infinite;}
  /* disk */
  .disk__plate{margin-top:2px; height:64px; border-radius:50%/12px;
    background:linear-gradient(180deg,#14273f,#0e2136); border:1px solid var(--line2);
    display:grid; place-items:center; position:relative; overflow:hidden;}
  .disk__plate::before{content:""; position:absolute; width:150%; height:150%;
    background:repeating-conic-gradient(from 0deg, rgba(45,199,216,.06) 0 8deg, transparent 8deg 16deg);}
  .disk__hub{width:12px; height:12px; border-radius:50%; background:var(--cyan); position:relative; z-index:1;}

  /* summary pills (scene 5) */
  .stage[data-scene="5"] .os{width:min(96%,860px); flex-wrap:wrap; justify-content:center; gap:12px;}
  .os__pills{display:none; gap:10px; flex-wrap:wrap; justify-content:center; z-index:1;}
  .stage[data-scene="5"] .os__id, .stage[data-scene="5"] .os__role{display:none;}
  .stage[data-scene="5"] .os__pills{display:flex;}
  .pill{font-weight:700; font-size:15px; padding:9px 16px; border-radius:99px; border:1.5px solid;}
  .pill.p1{color:var(--cyan); border-color:var(--cyan); background:rgba(45,199,216,.1);}
  .pill.p2{color:var(--amber); border-color:var(--amber); background:rgba(242,184,75,.1);}
  .pill.p3{color:var(--green); border-color:var(--green); background:rgba(84,200,120,.1);}

  /* vmem visible in scenes 3 & 4 */
  .stage[data-scene="3"] .app__vmem, .stage[data-scene="4"] .app__vmem{opacity:1; transform:none;}
  .stage[data-scene="3"] .app__vmem::after, .stage[data-scene="4"] .app__vmem::after{transform:scaleX(1);}

  /* ---------- controls ---------- */
  .controls{display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:space-between;}
  .steps{display:flex; gap:6px; flex-wrap:wrap;}
  .step{font-family:var(--mono); font-size:11.5px; letter-spacing:.03em; color:var(--mute);
    background:var(--navy2); border:1px solid var(--line); border-radius:99px; padding:6px 12px; cursor:pointer;
    transition:.25s; white-space:nowrap;}
  .step:hover{border-color:var(--line2); color:var(--ink);}
  .step[aria-current="true"]{background:var(--os); border-color:var(--os); color:#06131c; font-weight:600;}
  .btns{display:flex; gap:8px;}
  button.ctl{font-family:var(--sans); font-weight:600; font-size:14px; color:var(--ink);
    background:var(--panel); border:1px solid var(--line2); border-radius:10px; padding:9px 16px; cursor:pointer;
    transition:.2s; display:inline-flex; align-items:center; gap:7px;}
  button.ctl:hover{background:var(--panel2); border-color:var(--cyan);}
  button.ctl:focus-visible, .step:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}
  button.ctl.primary{background:var(--os); color:#06131c; border-color:var(--os);}
  button.ctl.primary:hover{filter:brightness(1.08);}
  button.ctl:disabled{opacity:.4; cursor:default;}
  .hint{font-family:var(--mono); font-size:11px; color:var(--dim); text-align:center; margin-top:2px;}

  @keyframes pulse{0%,100%{opacity:.35; transform:translateX(-50%) scaleY(.8);}50%{opacity:1; transform:translateX(-50%) scaleY(1.1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-2px);}75%{transform:translateX(2px);}}
  @keyframes pop{to{transform:scale(1);}}
  @keyframes breach{0%,100%{box-shadow:0 0 0 0 rgba(234,107,94,0);}50%{box-shadow:0 0 0 3px rgba(234,107,94,.6);}}

  @media (max-width:640px){
    .apps,.hw{flex-wrap:wrap;}
    .os{flex-direction:column; text-align:center;}
    .controls{flex-direction:column-reverse; align-items:stretch;}
    .btns{justify-content:center;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.15s!important;}
  }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">OSTEP · 認識作業系統</div>
    <h1><span class="os-word">作業系統</span>到底在忙什麼？</h1>
  </header>

  <div class="caption">
    <div class="role" id="role">三層架構</div>
    <div class="cap" id="cap">作業系統坐在硬體與應用程式之間：把難用的硬體變好用，又管好所有程式。</div>
  </div>

  <div class="stage" id="stage" data-scene="0">
    <!-- APPLICATIONS -->
    <div class="layer apps" id="apps">
      <div class="layer-label">應用程式 · Applications</div>
      <div class="app app--0"><div class="app__label">執行中</div><div class="app__top"><div class="app__glyph">Cr</div><div><div class="app__name">瀏覽器</div><div class="app__tag">Chrome</div></div></div><div class="app__vmem"></div><div class="app__conn"></div></div>
      <div class="app app--1"><div class="app__label">執行中</div><div class="app__top"><div class="app__glyph">♪</div><div><div class="app__name">音樂</div><div class="app__tag">Music</div></div></div><div class="app__vmem"></div><div class="app__conn"></div></div>
      <div class="app app--2"><div class="app__label">執行中</div><div class="app__top"><div class="app__glyph">▶</div><div><div class="app__name">遊戲</div><div class="app__tag">Game</div></div></div><div class="app__vmem"></div><div class="app__conn"></div></div>
      <div class="app app--3"><div class="app__label">執行中</div><div class="app__top"><div class="app__glyph">W</div><div><div class="app__name">文件</div><div class="app__tag">Word</div></div></div><div class="app__vmem"></div><div class="app__conn"></div></div>
    </div>

    <!-- OPERATING SYSTEM -->
    <div class="layer os" id="os">
      <div class="os__id">
        <div class="os__name">作<span>業</span>系統　Operating System</div>
        <div class="os__sub">硬體與程式之間的管理者</div>
      </div>
      <div class="os__role" id="osrole">三層架構</div>
      <div class="os__pills">
        <span class="pill p1">① 虛擬化</span>
        <span class="pill p2">② 資源管理</span>
        <span class="pill p3">③ 保護與隔離</span>
      </div>
      <div class="shield"><div class="shield__badge">⛊ 拒絕存取</div></div>
    </div>

    <!-- HARDWARE -->
    <div class="layer hw" id="hw">
      <div class="layer-label">硬體 · Hardware</div>
      <div class="unit">
        <div class="unit__h"><span class="unit__name">處理器</span><span class="unit__en">CPU</span></div>
        <div class="cpu__chip"><div class="cpu__core" id="cpucore">1</div></div>
        <div class="cpu__disp" id="cpudisp">一顆核心</div>
      </div>
      <div class="unit">
        <div class="unit__h"><span class="unit__name">記憶體</span><span class="unit__en">Memory</span></div>
        <div class="mem__grid" id="mem"></div>
      </div>
      <div class="unit">
        <div class="unit__h"><span class="unit__name">磁碟</span><span class="unit__en">Disk</span></div>
        <div class="disk__plate"><div class="disk__hub"></div></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="steps" id="steps"></div>
    <div class="btns">
      <button class="ctl" id="prev">‹ 上一步</button>
      <button class="ctl primary" id="play">▶ 自動播放</button>
      <button class="ctl" id="next">下一步 ›</button>
    </div>
  </div>
  <div class="hint">用 ← → 切換，空白鍵播放／暫停</div>
</div>

<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
  var SCENES = [
    {label:"架構", role:"三層架構",
      cap:"作業系統坐在硬體與應用程式之間：把難用的硬體變好用，又管好所有程式。"},
    {label:"問題", role:"問題：大家都想用",
      cap:"一台機器、一顆 CPU、一片記憶體——但很多程式同時都想用。誰先用？會不會打架？"},
    {label:"虛擬化 CPU", role:"① 虛擬化 CPU（排程）",
      cap:"OS 讓一顆 CPU 飛快地輪流服務每支程式，切換快到你察覺不到 → 每支程式都以為自己獨佔一顆 CPU。"},
    {label:"資源管理", role:"② 資源管理（記憶體）",
      cap:"每支程式都以為獨佔整片記憶體；OS 在背後把它們對映到實體記憶體的不同區塊，公平分配、互不重疊。"},
    {label:"保護", role:"③ 保護與隔離",
      cap:"有程式想偷看或破壞別人的記憶體？OS 擋下來。於是一支程式出錯，也不會拖垮其他程式。"},
    {label:"總結", role:"三件核心工作",
      cap:"這就是作業系統的三件事：虛擬化、資源管理、保護。這門課，就是逐一把它們拆開來看。"}
  ];
  var N = SCENES.length;
  var stage=document.getElementById('stage'), roleEl=document.getElementById('role'),
      capEl=document.getElementById('cap'), osrole=document.getElementById('osrole'),
      cpucore=document.getElementById('cpucore'), cpudisp=document.getElementById('cpudisp'),
      mem=document.getElementById('mem'), steps=document.getElementById('steps'),
      prevB=document.getElementById('prev'), nextB=document.getElementById('next'), playB=document.getElementById('play');
  var apps=[].slice.call(document.querySelectorAll('.app'));

  // build memory cells (12)
  var CELLS=12, memCells=[];
  for(var i=0;i<CELLS;i++){var d=document.createElement('div'); d.className='mem__cell'; mem.appendChild(d); memCells.push(d);}
  var MEMMAP=[0,0,0,1,1,2,2,2,3,3,-1,-1]; // cell -> app owner

  // build stepper
  SCENES.forEach(function(s,i){
    var b=document.createElement('button'); b.className='step'; b.textContent=(i+1)+'. '+s.label;
    b.addEventListener('click',function(){stop(); go(i);});
    steps.appendChild(b);
  });
  var stepBtns=[].slice.call(steps.children);

  var scene=0, rr=null, timers=[], auto=null, playing=false, cur=0;
  function clearTimers(){ timers.forEach(clearTimeout); timers=[]; if(rr){clearInterval(rr); rr=null;} }
  function reset(){
    clearTimers();
    apps.forEach(function(a){a.classList.remove('running','dim','attacker','victim');});
    memCells.forEach(function(c){c.className='mem__cell';});
    stage.classList.remove('denied');
    cpucore.textContent='1'; cpudisp.textContent='一顆核心';
  }
  function fillMemory(withBreach){
    memCells.forEach(function(c,i){
      var owner=MEMMAP[i]; if(owner<0) return;
      timers.push(setTimeout(function(){
        c.classList.add('used','c'+owner);
        if(withBreach && owner===0) c.classList.add('breach');
      }, reduce?0:110*i));
    });
  }
  function go(n){
    reset(); scene=n; stage.dataset.scene=n;
    roleEl.textContent=SCENES[n].role; osrole.textContent=SCENES[n].role;
    capEl.textContent=SCENES[n].cap;
    stepBtns.forEach(function(b,i){b.setAttribute('aria-current', i===n?'true':'false');});
    prevB.disabled = n===0; nextB.disabled = n===N-1;

    if(n===2){ // round-robin CPU
      cur=0;
      var tick=function(){
        apps.forEach(function(a,i){a.classList.toggle('running', i===cur); a.classList.toggle('dim', i!==cur);});
        cpucore.textContent=(cur+1); cpudisp.textContent='執行：P'+(cur+1);
        cur=(cur+1)%apps.length;
      };
      tick(); rr=setInterval(tick, reduce?1500:720);
    }
    if(n===3){ fillMemory(false); }
    if(n===4){
      apps[2].classList.add('attacker'); apps[2].querySelector('.app__label').textContent='想偷看記憶體';
      apps[0].classList.add('victim');
      fillMemory(true);
      timers.push(setTimeout(function(){ if(scene===4) stage.classList.add('denied'); }, reduce?0:950));
    }
    if(n===5){ apps.forEach(function(a){a.classList.add('running');}); }
  }
  // reset the attacker label when leaving scene 4
  var origLabel = apps[2].querySelector('.app__label').textContent;
  function restoreLabels(){ apps[2].querySelector('.app__label').textContent = origLabel; }

  function next(){ if(scene<N-1){ restoreLabels(); go(scene+1); return true;} return false; }
  function prev(){ if(scene>0){ restoreLabels(); go(scene-1);} }

  // autoplay
  function dur(n){ return n===2?7600 : n===4?6400 : 5600; }
  function schedule(){ clearTimeout(auto); auto=setTimeout(function(){ if(!next()){ stop(); } else if(playing){ schedule(); } }, dur(scene)); }
  function play(){ if(scene===N-1) go(0); playing=true; playB.textContent='⏸ 暫停'; playB.classList.remove('primary'); schedule(); }
  function stop(){ playing=false; playB.textContent='▶ 自動播放'; playB.classList.add('primary'); clearTimeout(auto); }
  function toggle(){ playing?stop():play(); }

  prevB.addEventListener('click',function(){stop(); prev();});
  nextB.addEventListener('click',function(){stop(); next();});
  playB.addEventListener('click',toggle);
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){e.preventDefault(); stop(); next();}
    else if(e.key==='ArrowLeft'){e.preventDefault(); stop(); prev();}
    else if(e.key===' '){e.preventDefault(); toggle();}
  });

  go(0);
})();
</script>
